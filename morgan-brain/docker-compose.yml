name: morgan-brain

services:
  brain-api:
    build: { context: ., dockerfile: Dockerfile, target: runtime }
    command: python -m morgan_brain.apps.brain_api
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      # A container's published port is unreachable from a loopback bind, so this overrides
      # the loopback default — which means MORGAN_API_KEY in .env must be a real key or
      # brain-api refuses to start. That refusal is the point: a published port with
      # authentication disabled is an open memory store.
      MORGAN_API_HOST: 0.0.0.0
      MORGAN_EVENT_BUS: redis
      MORGAN_REDIS_URL: redis://redis:6379/0
      MORGAN_QDRANT_URL: http://qdrant:6333
      # Shared persistent vector store so brain-api + worker see the same memory.
      MORGAN_VECTOR_BACKEND: qdrant
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    volumes: ["./data:/app/data"]

  learning-worker:
    build: { context: ., dockerfile: Dockerfile, target: runtime }
    command: python -m morgan_brain.apps.learning_worker
    env_file: [.env]
    environment:
      MORGAN_EVENT_BUS: redis
      MORGAN_REDIS_URL: redis://redis:6379/0
      MORGAN_QDRANT_URL: http://qdrant:6333
      MORGAN_VECTOR_BACKEND: qdrant
      # Run the nightly consolidation + eval-gated optimizer loop.
      MORGAN_ENABLE_SCHEDULING: "true"
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    volumes: ["./data:/app/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes: ["redis-data:/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes: ["qdrant-storage:/qdrant/storage"]

volumes:
  redis-data:
  qdrant-storage:
