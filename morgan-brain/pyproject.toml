[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morgan-brain"
version = "0.1.0"
description = "Self-hosted personal assistant that knows and learns from you (MAPLE + SkillOpt)."
requires-python = ">=3.12"
license = { file = "../LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "redis>=5.2",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "black>=24.0",
]
# Deferred / phase-gated extras
mcp = ["mcp>=1.0"]
channels = ["python-telegram-bot>=21.0", "discord.py>=2.4"]
scheduling = ["apscheduler>=3.10"]
tokens = ["tiktoken>=0.8"]
perception = ["openai-whisper", "onnxruntime", "transformers"]

[project.scripts]
morgan = "clients.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["morgan_brain", "clients"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
