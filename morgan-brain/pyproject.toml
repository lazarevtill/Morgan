[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morgan-brain"
version = "0.1.0"
description = "Self-hosted personal assistant that knows and learns from you (MAPLE + SkillOpt)."
requires-python = ">=3.12"
license = { file = "../LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "openai>=1.0",
    "structlog>=24.4",
    "redis>=5.2",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "black>=24.0",
]
# Deferred / phase-gated extras
mcp = ["mcp>=1.0"]
channels = ["python-telegram-bot>=21.0", "discord.py>=2.4"]
scheduling = ["apscheduler>=3.10"]
tokens = ["tiktoken>=0.8"]
perception = ["openai-whisper", "onnxruntime", "transformers"]
# Learning lifecycle — MLflow-backed PromptRegistry + GEPA optimizer (Wave 1/5).
# Core deps intentionally excluded; install this extra when enabling learning_backend="mlflow".
learning = ["mlflow>=3.4"]
# Slim tracing-only package for the hot-path service layer (much smaller than full mlflow).
tracing = ["mlflow-tracing"]
# Privacy — field-level encryption + Presidio NER for PII redaction (Wave 0.5b).
# presidio-analyzer/anonymizer: Tier-2 NER redaction (closes non-English name gap).
# cryptography: AES-256-GCM seal/open for field-level encryption.
# argon2-cffi: Argon2id KEK derivation from passphrase.
privacy = [
    "presidio-analyzer",
    "presidio-anonymizer",
    "cryptography>=42",
    "argon2-cffi>=23",
]

[project.scripts]
morgan = "clients.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["morgan_brain", "clients"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

# Optional-dep modules: warn_unused_ignores must be disabled per-file because
# whether import-not-found fires depends on the local install state.  Using a
# per-file override is cleaner than removing strict globally.
[[tool.mypy.overrides]]
module = [
    "morgan_brain.privacy.redaction",
    "morgan_brain.privacy.crypto",
]
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "timeout: mark test with a wall-clock timeout in seconds (requires pytest-timeout; skipped if not installed)",
    "live: mark test as requiring live external services (Qdrant, Redis); skipped by default",
]
