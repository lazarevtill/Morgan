[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morgan-brain"
version = "0.1.0"
description = "Self-hosted personal assistant that knows and learns from you (MAPLE + SkillOpt)."
requires-python = ">=3.12"
license = { file = "../LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "openai>=1.0",
    "structlog>=24.4",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "black>=24.0",
]
# Deferred / phase-gated extras
scale = ["redis>=5.2", "qdrant-client>=1.12"]
scheduling = ["apscheduler>=3.10"]
tokens = ["tiktoken>=0.8"]
# Learning lifecycle — MLflow-backed PromptRegistry + GEPA optimizer (Wave 1/5).
# Core deps intentionally excluded; install this extra when enabling learning_backend="mlflow".
learning = ["mlflow>=3.4"]
# Slim tracing-only package for the hot-path service layer (much smaller than full mlflow).
tracing = ["mlflow-tracing"]
# MCP server port (Task 17A) -- other AI tools calling in to Morgan over the Model Context
# Protocol. Capped below 2.0: mcp 2.0 is a breaking rewrite that swaps httpx for an
# incompatible httpx2 package, which would collide with every other httpx consumer in this repo.
mcp = ["mcp>=1.0,<2.0"]

[project.scripts]
morgan = "morgan_brain.cli.__main__:main"
morgan-mcp = "morgan_brain.ports.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["morgan_brain"]
artifacts = [
    "morgan_brain/eval/data/*.json",
    "morgan_brain/providers/data/*.json",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "timeout: mark test with a wall-clock timeout in seconds (requires pytest-timeout; skipped if not installed)",
    "live: mark test as requiring live external services (Qdrant, Redis); skipped by default",
]
