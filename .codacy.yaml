---
# Static analysis scope.
#
# Test code is excluded from the security scanners, not from review. Bandit reads pytest's
# own idiom as a vulnerability: every `assert` is B101 (1300+ of them), every subprocess call
# in the CLI integration tests is B603/B607, and the string "0.0.0.0" in the tests that prove
# Morgan *refuses* to bind it is B104. None of that ships. Production code under
# morgan-brain/morgan_brain is scanned in full and is clean.
exclude_paths:
  - "morgan-brain/tests/**"
  - "**/__pycache__/**"
