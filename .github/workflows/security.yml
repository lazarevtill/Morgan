name: Security Scanning

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  code-security:
    name: Code Security Analysis (bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morgan-brain
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install "bandit[toml]"

      # No continue-on-error and no -ll severity floor: the scan reports zero findings at
      # every severity, so anything new is a regression and should fail the build.
      - name: Run Bandit
        run: bandit -c pyproject.toml -r morgan_brain

  # Note: CodeQL runs via the repository's *default* CodeQL setup (the separate
  # "CodeQL" check), so we do not define a custom codeql job here — an advanced
  # config cannot run while default setup is enabled.
