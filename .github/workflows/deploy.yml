name: Deploy

# Manual-only. Real deployment (push to a private registry + SSH to hosts)
# depends on infrastructure reachable only over a private overlay network, and
# must be re-wired before re-enabling on push.
#
# The composite actions that set up that overlay network were deleted: no
# workflow referenced them, and they hardcoded a private management endpoint in
# a public repository. When deployment is re-enabled, the endpoint belongs in
# `${{ secrets.* }}` or a workflow input -- never in a checked-in URL.
# Until then this workflow only verifies the image builds, on demand.
on:
  workflow_dispatch:

jobs:
  build-image:
    name: Build morgan-brain image (smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build morgan-brain image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: morgan-brain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
