name: Deploy

# Manual-only. Real deployment (push to the internal Harbor registry + SSH to
# hosts) depends on internal infrastructure reachable only over the org VPN and
# must be re-wired for the new `morgan-brain` layout before re-enabling on push.
# Until then this workflow only verifies the image builds, on demand.
on:
  workflow_dispatch:

jobs:
  build-image:
    name: Build morgan-brain image (smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build morgan-brain image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./morgan-brain
          file: ./morgan-brain/Dockerfile
          push: false
          tags: morgan-brain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
