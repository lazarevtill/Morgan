name: morgan

services:
  morgan-mcp:
    build: .
    ports: ["8090:8090"]
    # MORGAN_LLM_ENDPOINT, MORGAN_API_KEY (required: the port is published) and the model
    # names come from .env next to this file.
    env_file: [.env]
    environment:
      MORGAN_DATA_DIR: /app/data
    volumes: ["./data:/app/data"]
